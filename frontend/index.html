<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-label="Login form">
      <img src="logo.png" alt="BudgetBuddy logo" style="display:block;margin:0 auto 12px;width:min(70%,230px);height:auto;">
      <h1>Login</h1>
 
      <form class="login-form">
        <!-- Email -->
        <div class="field-group">
          <div class="input-wrap">
            <input id="email" name="email" type="email" placeholder=" " required />
            <label for="email">Email</label>
          </div>
        </div>
 
                <div class="field-group">
          <div class="input-wrap">
            <input id="password" name="password" type="password" placeholder=" " required />
            <label for="password">Password</label>
          </div>
        </div>
 
        <button class="login-btn" type="submit">Login</button>
 
        <div class="meta-links">
          <a href="create-account.html">Create an account</a>
          <a href="#">Forgot Password?</a>
        </div>
      </form>
    </section>
  </main>
  <script src="budgetbuddy.js"></script>
</body>
</html>
